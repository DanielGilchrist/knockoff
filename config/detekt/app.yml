knockoff:
  active: true
  excludes: ['**/test/**']
  NoImportAlias:
    active: true
  NoTypeFiltering:
    active: true
  UnusedImport:
    active: true
  UnapprovedCatch:
    active: true
    allowedExceptions:
      # Updating a channel the app deleted since it was read; converted to ChannelUpdate.Missing.
      - IllegalArgumentException
      # A time zone change broadcast naming an unknown zone; converted to ZoneExtra.Invalid.
      - DateTimeException
      # StagedFile reads and writes; converted to FileRead and FileWrite.
      - IOException
      # StagedFile: a file that doesn't exist yet is FileRead.Missing, not a failure.
      - NoSuchFileException
      # StagedFile: invalid UTF-8 is FileRead.Undecodable.
      - CharacterCodingException
      # Opening notification access settings on a device without that screen.
      - ActivityNotFoundException
      # PackageIconSource: an app uninstalled since it was listed; converted to AppIcon.Missing.
      - NameNotFoundException
    allowedOnlyIn:
      # A system service refusing an unapproved or unlinked listener, or a missing permission; SystemCall.Refused.
      - SecurityException in dev.danielgilchrist.knockoff.system.systemCall
      # A list the system can't finish sending, such as when the binder buffer is full; SystemCall.Unavailable.
      - BadParcelableException in dev.danielgilchrist.knockoff.system.systemCall
      # Android rethrows binder failures from system services as RuntimeExceptions (a hidden
      # DeadSystemRuntimeException, or one caused by a RemoteException); those become SystemCall.Unavailable and
      # anything else is rethrown.
      - RuntimeException in dev.danielgilchrist.knockoff.system.systemCall
  UnapprovedThrow:
    active: true
    allowedDeclarations:
      # Reading LocalAppIcons outside MainActivity's provider is a wiring bug that must crash loudly.
      - dev.danielgilchrist.knockoff.ui.appicon.LocalAppIcons
      # systemCall catches RuntimeException to find binder failures; anything else is a bug and is rethrown as is.
      - dev.danielgilchrist.knockoff.system.unavailableOrRethrown(RuntimeException)
  UntypedResult:
    active: true
exceptions:
  TooGenericExceptionCaught:
    # RuntimeException is left to knockoff's UnapprovedCatch, which approves it only inside systemCall.
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - IndexOutOfBoundsException
      - NullPointerException
      - Throwable
