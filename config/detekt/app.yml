knockoff:
  active: true
  excludes: ['**/test/**']
  NoImportAlias:
    active: true
  NoTypeFiltering:
    active: true
  UnusedImport:
    active: true
  UnapprovedCatch:
    active: true
    allowedExceptions:
      # Listener calls refuse an unapproved or unlinked listener, exact alarms and the calendar provider refuse
      # without permission; converted to sealed outcomes (SnoozeOutcome, ChannelFetch, ChannelUpdate, AlarmSchedule,
      # CalendarQuery, CalendarWatching).
      - SecurityException
      # A notification or channel list the system can't finish sending, such as when the binder buffer is full;
      # converted to NotificationRead.Unavailable, ChannelFetch.Unavailable and GroupNamesFetch.Unavailable.
      - BadParcelableException
      # Updating a channel the app deleted since it was read; converted to ChannelUpdate.Missing.
      - IllegalArgumentException
      # A time zone change broadcast naming an unknown zone; converted to ZoneExtra.Invalid.
      - DateTimeException
      # StagedFile reads and writes; converted to FileRead and FileWrite.
      - IOException
      # StagedFile: a file that doesn't exist yet is FileRead.Missing, not a failure.
      - NoSuchFileException
      # StagedFile: invalid UTF-8 is FileRead.Undecodable.
      - CharacterCodingException
      # Opening notification access settings on a device without that screen.
      - ActivityNotFoundException
      # PackageIconSource: an app uninstalled since it was listed; converted to AppIcon.Missing.
      - NameNotFoundException
  UnapprovedThrow:
    active: true
    allowedDeclarations:
      # Reading LocalAppIcons outside MainActivity's provider is a wiring bug that must crash loudly.
      - dev.danielgilchrist.knockoff.ui.appicon.LocalAppIcons
  UntypedResult:
    active: true
