knockoff:
  active: true
  excludes: ['**/test/**']
  NoImportAlias:
    active: true
  NoTypeFiltering:
    active: true
  UnusedImport:
    active: true
  UnapprovedCatch:
    active: true
    allowedExceptions:
      # Settings.fromJson parses untrusted JSON into SettingsDecode.
      - SerializationException
      # StoredWindow and StoredLeave parse stored times and dates into Parsed.
      - DateTimeParseException
      # ZoneChoice.parse turns an unknown zone id into ZoneChoiceParse.Unknown.
      - DateTimeException
      # TextPattern.parse turns an invalid regular expression into TextPatternParse.Invalid.
      - PatternSyntaxException
  UnapprovedThrow:
    active: true
    allowedDeclarations: []
  UntypedResult:
    active: true
